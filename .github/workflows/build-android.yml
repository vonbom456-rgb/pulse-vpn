name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android runner
        run: flutter create . --platforms=android --org=app.pulse.vpn

      - name: Match sing-box Android requirements
        shell: bash
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 26/' android/app/build.gradle.kts
            sed -i '/sourceCompatibility = JavaVersion.VERSION_17/a\        isCoreLibraryDesugaringEnabled = true' android/app/build.gradle.kts
            perl -0pi -e 's|\z|\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n}\n|' android/app/build.gradle.kts
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 26/' android/app/build.gradle
            sed -i '/sourceCompatibility JavaVersion.VERSION_17/a\        coreLibraryDesugaringEnabled true' android/app/build.gradle
            perl -0pi -e "s|\z|\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'\n}\n|" android/app/build.gradle
          fi
          if [ -f android/build.gradle.kts ]; then
            sed -i '/        mavenCentral()/a\        maven { url = uri("https://jitpack.io") }' android/build.gradle.kts
          fi
          if [ -f android/build.gradle ]; then
            sed -i "/        mavenCentral()/a\\        maven { url 'https://jitpack.io' }" android/build.gradle
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Pulse launcher icon
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pulse-vpn-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
