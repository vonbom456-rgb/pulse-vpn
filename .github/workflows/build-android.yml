name: Build native Pulse VPN

on:
  workflow_dispatch:
  push:
    branches: [main, "native/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Android lint
        run: gradle :app:lintDebug --stacktrace
      - name: Release APKs
        run: gradle :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: pulse-vpn-native-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          compression-level: 0

  ui-review:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Build UI test APKs
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Exercise import and themes on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install app/build/outputs/apk/debug/app-x86_64-debug.apk
            adb install -t app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r app.pulse.vpn.test/androidx.test.runner.AndroidJUnitRunner | tee ui-instrumentation.txt
            adb pull /sdcard/Android/data/app.pulse.vpn/files/ui-review ui-review
            grep -q 'OK (2 tests)' ui-instrumentation.txt
      - name: UI screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulse-ui-review
          path: |
            ui-review/*.png
            ui-instrumentation.txt
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
