name: pulse_vpn
description: Premium cross-platform VLESS VPN client UI.
publish_to: none
version: 0.2.0+2

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  flutter_animate: ^4.5.2
  dio: ^5.8.0+1
  hive_flutter: ^1.1.0
  mobile_scanner: ^6.0.7
  fl_chart: ^0.70.2
  flutter_sing_box: ^1.1.5
  flutter_secure_storage: ^11.0.0
  app_links: ^6.4.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/pulse_app_icon.png
  min_sdk_android: 26
