          unzip -q /tmp/pulse-vpn.zip -d /tmp/pulse-source
          cp -R /tmp/pulse-source/pulse_vpn/. .

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android runner
        run: flutter create . --platforms=android --org=app.pulse.vpn

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        continue-on-error: true
        run: flutter analyze

      - name: Test
        continue-on-error: true
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pulse-vpn-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

